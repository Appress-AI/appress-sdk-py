name: Publish to PyPI

# Runs when a GitHub Release is published (the tag must match the package version, e.g. v0.1.0).
# Authenticates with PyPI Trusted Publishing (OIDC): no token needed.
# pypi.org -> appress -> Publishing: Appress-AI / appress-sdk-py / publish.yml / environment "pypi"
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -U pip build twine
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import re; print(re.search(r'\"(.+)\"', open('src/appress/_version.py').read()).group(1))")
          test "v${version}" = "${GITHUB_REF_NAME}"
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC identity for PyPI + attestations
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
